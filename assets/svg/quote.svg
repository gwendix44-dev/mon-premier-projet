<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" font-family="system-ui,Arial,sans-serif">
<text x="180" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Anatomie d'un devis (exemple de structure)</text>
<g font-size="10" text-anchor="middle" fill="#fff" font-weight="700">
<rect x="10" y="30" width="110" height="40" fill="#1d4ed8"/><text x="65" y="48">Heures de vol</text><text x="65" y="61" font-weight="400">temps × tarif/h</text>
<rect x="120" y="30" width="55" height="40" fill="#0ea5e9"/><text x="147" y="48">Reposi-</text><text x="147" y="61">tionnement</text>
<rect x="175" y="30" width="70" height="40" fill="#14b8a6"/><text x="210" y="48">Atterrissage</text><text x="210" y="61">& handling</text>
<rect x="245" y="30" width="50" height="40" fill="#64748b"/><text x="270" y="48">Équipage</text><text x="270" y="61">nuits</text>
<rect x="295" y="30" width="55" height="40" fill="#94a3b8"/><text x="322" y="48">Catering</text><text x="322" y="61">dégivrage</text>
</g>
<path d="M10 76 H350" stroke="#1d4ed8" stroke-width="2"/><text x="180" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">= Prix net de l'opérateur</text>
<g font-size="11" text-anchor="middle" fill="#fff" font-weight="700">
<rect x="10" y="108" width="240" height="40" fill="#1d4ed8"/><text x="130" y="132">Prix net opérateur</text>
<rect x="250" y="108" width="50" height="40" fill="#7c3aed"/><text x="275" y="132">Marge</text>
<rect x="300" y="108" width="50" height="40" fill="#f59e0b"/><text x="325" y="132">Taxes*</text>
</g>
<path d="M10 154 H350" stroke="#334155" stroke-width="2"/><text x="180" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">= Prix proposé au client</text>
<text x="180" y="190" text-anchor="middle" font-size="9.5" fill="#64748b">* selon le pays, le type de vol et le client. Les proportions sont illustratives.</text>
</svg>
